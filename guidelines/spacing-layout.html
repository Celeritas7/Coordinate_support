<!-- @dsCard group="Spacing" viewport="700x200" name="Layout" subtitle="360px sidebar · 3D view · 230px dock. Collapses to one column under 860px." -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Layout</title><link rel="stylesheet" href="../styles.css"><style>body{padding:16px;background:var(--panel)}.g{display:grid;gap:10px}.sw{display:grid;gap:5px;font-size:12px;color:var(--muted)}.sw i{display:block;height:44px;border-radius:4px;border:1px solid var(--rule)}.sw b{color:var(--ink);font-weight:500;font-family:var(--mono);font-size:12px}.sw small{font-family:var(--mono)}.l{display:grid;grid-template-columns:120px 1fr;height:150px;border:1px solid var(--rule);font:11px var(--mono);color:var(--muted)}.l>*{padding:6px}</style></head><body><div style="display:grid;grid-template-columns:2fr 1fr;gap:14px"><div class="l"><div style="background:var(--panel);border-right:1px solid var(--rule)">aside 360</div><div style="display:grid;grid-template-rows:1fr 46px;padding:0"><div style="padding:6px;background:var(--paper)">view 1fr</div><div style="padding:6px;background:var(--panel);border-top:1px solid var(--rule)">dock 230</div></div></div><div class="l" style="grid-template-columns:1fr;grid-template-rows:auto 1fr 40px"><div style="background:var(--panel);border-bottom:1px solid var(--rule)">aside</div><div style="background:var(--paper)">view 58vh</div><div style="background:var(--panel);border-top:1px solid var(--rule)">dock 260</div></div></div></body></html>
