<!-- @dsCard group="Colors" viewport="700x150" name="Dark theme" subtitle="Same token names, remapped under [data-theme=dark] or prefers-color-scheme" -->
<!DOCTYPE html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><title>Dark theme</title><link rel="stylesheet" href="../styles.css"><style>body{padding:16px;background:var(--paper)}.g{display:grid;gap:10px}.sw{display:grid;gap:5px;font-size:12px;color:var(--muted)}.sw i{display:block;height:40px;border-radius:4px;border:1px solid var(--rule)}.sw b{color:var(--ink);font-weight:500;font-family:var(--mono);font-size:12px}.sw small{font-family:var(--mono)}</style></head><body><div class="g" style="grid-template-columns:repeat(7,1fr)"><div class="sw"><i style="background:var(--paper)"></i><b>--paper</b><small>#161C23</small></div><div class="sw"><i style="background:var(--panel)"></i><b>--panel</b><small>#1C242D</small></div><div class="sw"><i style="background:var(--field)"></i><b>--field</b><small>#131920</small></div><div class="sw"><i style="background:var(--ink)"></i><b>--ink</b><small>#E3E9EF</small></div><div class="sw"><i style="background:var(--muted)"></i><b>--muted</b><small>#94A2B2</small></div><div class="sw"><i style="background:var(--rule)"></i><b>--rule</b><small>#303B47</small></div><div class="sw"><i style="background:var(--ok)"></i><b>--ok</b><small>#5A9BE0</small></div></div><div style="margin-top:10px;font-size:12.5px;color:var(--muted)">warn <span style="color:var(--warn);font-family:var(--mono)">#E3A340</span> · bad <span style="color:var(--bad);font-family:var(--mono)">#EE5A63</span> · grid <span style="font-family:var(--mono)">#2A3440</span></div></body></html>
