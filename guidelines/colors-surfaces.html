<!-- @dsCard group="Colors" viewport="700x120" name="Surfaces" subtitle="Three greys of paper: app, panel, field — plus the two rule/grid lines" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Surfaces</title><link rel="stylesheet" href="../styles.css"><style>body{padding:16px;background:var(--panel)}.g{display:grid;gap:10px}.sw{display:grid;gap:5px;font-size:12px;color:var(--muted)}.sw i{display:block;height:44px;border-radius:4px;border:1px solid var(--rule)}.sw b{color:var(--ink);font-weight:500;font-family:var(--mono);font-size:12px}.sw small{font-family:var(--mono)}</style></head><body><div class="g" style="grid-template-columns:repeat(5,1fr)"><div class="sw"><i style="background:var(--paper)"></i><b>--paper</b><small>#E9EDF1</small><span>app background</span></div><div class="sw"><i style="background:var(--panel)"></i><b>--panel</b><small>#F7F9FB</small><span>sidebar, dock, chips</span></div><div class="sw"><i style="background:var(--field)"></i><b>--field</b><small>#FFFFFF</small><span>inputs, selected run</span></div><div class="sw"><i style="background:var(--rule)"></i><b>--rule</b><small>#C9D2DB</small><span>all borders</span></div><div class="sw"><i style="background:var(--grid)"></i><b>--grid</b><small>#CBD4DD</small><span>3D floor grid</span></div></div></body></html>
