<!-- @dsCard group="Colors" viewport="700x120" name="Run palette" subtitle="Six colours assigned to comparison runs in order, cycling" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Run palette</title><link rel="stylesheet" href="../styles.css"><style>body{padding:16px;background:var(--panel)}.g{display:grid;gap:10px}.sw{display:grid;gap:5px;font-size:12px;color:var(--muted)}.sw i{display:block;height:44px;border-radius:4px;border:1px solid var(--rule)}.sw b{color:var(--ink);font-weight:500;font-family:var(--mono);font-size:12px}.sw small{font-family:var(--mono)}</style></head><body><div class="g" style="grid-template-columns:repeat(6,1fr)"><div class="sw"><i style="background:var(--run-1)"></i><b>--run-1</b><small>#2B6CB0</small></div><div class="sw"><i style="background:var(--run-2)"></i><b>--run-2</b><small>#C8323C</small></div><div class="sw"><i style="background:var(--run-3)"></i><b>--run-3</b><small>#2F8F63</small></div><div class="sw"><i style="background:var(--run-4)"></i><b>--run-4</b><small>#8A5BD6</small></div><div class="sw"><i style="background:var(--run-5)"></i><b>--run-5</b><small>#D08A1E</small></div><div class="sw"><i style="background:var(--run-6)"></i><b>--run-6</b><small>#0E7C86</small></div></div></body></html>
