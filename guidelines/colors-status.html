<!-- @dsCard group="Colors" viewport="700x120" name="Status" subtitle="ok / warn / bad — bend radius verdicts. ok blue is also the link and focus colour." -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Status</title><link rel="stylesheet" href="../styles.css"><style>body{padding:16px;background:var(--panel)}.g{display:grid;gap:10px}.sw{display:grid;gap:5px;font-size:12px;color:var(--muted)}.sw i{display:block;height:44px;border-radius:4px;border:1px solid var(--rule)}.sw b{color:var(--ink);font-weight:500;font-family:var(--mono);font-size:12px}.sw small{font-family:var(--mono)}</style></head><body><div class="g" style="grid-template-columns:repeat(4,1fr)"><div class="sw"><i style="background:var(--ok)"></i><b>--ok</b><small>#2B6CB0</small><span>OK · link · focus ring</span></div><div class="sw"><i style="background:var(--warn)"></i><b>--warn</b><small>#D08A1E</small><span>inside safety margin</span></div><div class="sw"><i style="background:var(--bad)"></i><b>--bad</b><small>#C8323C</small><span>below min radius</span></div><div class="sw"><i style="background:var(--focus)"></i><b>--focus</b><small>#2B6CB0</small><span>focus outline (= ok)</span></div></div></body></html>
