<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Ink</title><link rel="stylesheet" href="../styles.css"><style>body{padding:16px;background:var(--panel)}.g{display:grid;gap:10px}.sw{display:grid;gap:5px;font-size:12px;color:var(--muted)}.sw i{display:block;height:44px;border-radius:4px;border:1px solid var(--rule)}.sw b{color:var(--ink);font-weight:500;font-family:var(--mono);font-size:12px}.sw small{font-family:var(--mono)}</style></head><body><div class="g" style="grid-template-columns:1fr 1fr 2fr"><div class="sw"><i style="background:var(--ink)"></i><b>--ink</b><small>#1F2A36</small><span>text, primary button, selected tab underline</span></div><div class="sw"><i style="background:var(--muted)"></i><b>--muted</b><small>#5B6878</small><span>labels, hints, units, secondary text</span></div><div style="font-size:13px;line-height:1.45;padding-top:2px"><div style="font-weight:600">Route Studio</div><div style="color:var(--muted)">Muted carries every label, unit and hint. There is no third grey.</div><button style="margin-top:8px;padding:7px 12px;border:0;border-radius:4px;background:var(--ink);color:var(--paper);font:600 13px var(--sans)">Ink on paper</button></div></div></body></html>
