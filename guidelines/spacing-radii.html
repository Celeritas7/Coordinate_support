<!-- @dsCard group="Spacing" viewport="700x130" name="Radii, borders, shadow" subtitle="4px controls, 3px tags, 2px swatches. 1px rule borders everywhere. One inset ring, no drop shadows." -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Radii</title><link rel="stylesheet" href="../styles.css"><style>body{padding:16px;background:var(--panel)}.g{display:grid;gap:10px}.sw{display:grid;gap:5px;font-size:12px;color:var(--muted)}.sw i{display:block;height:44px;border-radius:4px;border:1px solid var(--rule)}.sw b{color:var(--ink);font-weight:500;font-family:var(--mono);font-size:12px}.sw small{font-family:var(--mono)}</style></head><body><div style="display:flex;gap:14px;align-items:center;font-size:12px;color:var(--muted)"><div style="display:grid;gap:5px;justify-items:center"><div style="width:72px;height:44px;background:var(--field);border:1px solid var(--rule);border-radius:4px"></div>4px control</div><div style="display:grid;gap:5px;justify-items:center"><span style="display:inline-block;font:500 12px var(--sans);padding:2px 5px;border-radius:3px;background:var(--panel);border:1px solid var(--rule);color:var(--ink)">R 41.7 mm</span>3px tag</div><div style="display:grid;gap:5px;justify-items:center"><span style="display:block;width:11px;height:11px;border-radius:2px;background:var(--run-3)"></span>2px swatch</div><div style="display:grid;gap:5px;justify-items:center"><span style="display:block;width:16px;height:5px;border-radius:3px;background:var(--warn)"></span>legend bar</div><div style="display:grid;gap:5px;justify-items:center"><div style="width:150px;padding:7px 6px;border-radius:4px;background:var(--field);box-shadow:inset 0 0 0 1px var(--rule);font-size:13px;color:var(--ink)">selected run</div>inset 0 0 0 1px rule</div><div style="display:grid;gap:5px;justify-items:center"><div style="width:72px;height:32px;border-radius:4px;background:var(--field);border:1px solid var(--rule);outline:2px solid var(--focus);outline-offset:1px"></div>focus 2px / offset 1</div></div></body></html>
