<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Route Studio</title><link rel="stylesheet" href="styles.css">
<style>html,body{margin:0;width:1280px;height:854px;overflow:hidden}.t{display:grid;grid-template-columns:1fr 320px;width:1280px;height:854px}.m{background:var(--ink);display:flex;align-items:center;justify-content:center;color:var(--paper);font:600 118px/1 var(--sans);letter-spacing:-.02em;white-space:nowrap}.s{display:grid;grid-template-rows:repeat(4,1fr)}.s div{width:100%;height:100%}</style></head>
<body><div class="t"><div class="m">Route Studio</div><div class="s"><div style="background:#D08A1E"></div><div style="background:#2F8F63"></div><div style="background:#C8323C"></div><div style="background:#2B6CB0"></div></div></div></body></html>
